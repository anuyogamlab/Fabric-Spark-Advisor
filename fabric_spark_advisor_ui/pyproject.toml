[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-spark-advisor-ui"
version = "0.2.0"
description = "Polished Fabric Spark Advisor chat UI for Fabric/Jupyter notebooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Source = "https://github.com/anuyogamlab/Fabric-Spark-Advisor"

[tool.setuptools.packages.find]
where = ["."]
include = ["fabric_spark_advisor_ui*"]
